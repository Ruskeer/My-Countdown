<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link href="count.css" rel="stylesheet">
</head>
<body>
    <div class="hero">
        <div class="hero-overlay"></div>
        <h1>Countdown Timer</h1>
        <div class="timebox">
            <div class="time">
                <h2 id="days">00</h2>
                <p>Days</p>
            </div>

            <div class="time">
                <h2 id="hours">00</h2>
                <p>Hours</p>
            </div>

            <div class="time">
                <h2 id="minutes">00</h2>
                <p>Minutes</p>
            </div>

            <div class="time">
                <h2 id="seconds">00</h2>
                <p>Seconds</p>
            </div>
        </div>
        <p class="com">Before my Graduation</p>
    </div>

    <script src="count.js"></script>
</body>
</html>
